name: Release @mizunashi/api-client

# release-types.yml と同じ構成。Trusted Publishing の信頼先が
# ワークフローファイル単位で登録されるため、パッケージごとに分けている。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン: semver bump (patch/minor/major/prerelease) か明示バージョン（例 0.2.0）'
        required: true
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check

      - name: Bump version
        id: bump
        working-directory: packages/api-client
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=api-client-v${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::バージョンは既に ${NEW} です。コミットは省略し、公開のみ行います"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # api-types に依存するため、先にビルドして型を解決できるようにする
      - name: Build
        run: |
          pnpm --filter @mizunashi/api-types build
          pnpm --filter @mizunashi/api-client build

      # 依存の @mizunashi/api-types が npm に公開済みであることを確認する。
      # 未公開のまま公開すると、利用者がインストールできないパッケージになる
      - name: Verify dependency is published
        run: |
          DEP_VERSION="$(node -p "require('./packages/api-types/package.json').version")"
          npm view "@mizunashi/api-types@$DEP_VERSION" version

      # exports が指すファイルの実在と、CJS / ESM 双方からの読み込みを実測する
      - name: Verify package
        run: pnpm verify:dist

      - name: Pack
        run: pnpm --filter @mizunashi/api-client pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        run: npm publish "$RUNNER_TEMP"/mizunashi-api-client-*.tgz --provenance --access public

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            git commit -am "release(api-client): ${{ steps.bump.outputs.tag }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null; then
            git tag "${{ steps.bump.outputs.tag }}"
          fi
          git push origin HEAD "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes
