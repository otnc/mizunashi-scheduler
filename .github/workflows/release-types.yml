name: Release @mizunashi/api-types

# npm の Trusted Publishing は「リポジトリ + ワークフローファイル名」で信頼先を登録する。
# パッケージごとにファイルを分けているのはそのため。
#
# バージョンはこのワークフロー自身が上げる。実行時に semver bump
# （patch/minor/major/prerelease）か明示バージョンを指定する。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン: semver bump (patch/minor/major/prerelease) か明示バージョン（例 0.2.0）'
        required: true
        default: patch

permissions:
  contents: write # バージョンのコミット・タグ・push・GitHub Release の作成
  id-token: write # npm provenance（OIDC）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # タグ・コミットを push するため全履歴が要る

      # packageManager を置かない方針（AGENTS.md §3）なので、ここで版を指示する。
      # 上限を切らないという方針に合わせて latest を使う
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing には npm CLI 11.5.1 以降が要る。
      # pnpm は OIDC の交換を行わないため、公開自体は npm publish を直接使う
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      # 公開したバージョンは事実上取り消せない。先に全検証を通す（AGENTS.md §7）
      - name: Verify
        run: pnpm check

      - name: Bump version
        id: bump
        working-directory: packages/api-types
        run: |
          OLD="$(node -p "require('./package.json').version")"
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version >/dev/null
          NEW="$(node -p "require('./package.json').version")"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=api-types-v${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::バージョンは既に ${NEW} です。コミットは省略し、公開のみ行います"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: pnpm --filter @mizunashi/api-types build

      # exports が指すファイルの実在と、CJS / ESM 双方からの読み込みを実測する
      - name: Verify package
        run: pnpm verify:dist

      # pnpm pack は workspace: プロトコルを実際のバージョンに書き換える。
      # 生成した tarball を npm CLI で公開することで、OIDC と provenance を使いつつ
      # ワークスペース参照も正しく解決される
      - name: Pack
        run: pnpm --filter @mizunashi/api-types pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        run: npm publish "$RUNNER_TEMP"/mizunashi-api-types-*.tgz --provenance --access public

      - name: Commit, tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # バージョンが変わっていないとき（同一バージョンの再公開）はコミットせず、タグと Release だけ揃える
          if [ "${{ steps.bump.outputs.changed }}" = "true" ]; then
            git commit -am "release(api-types): ${{ steps.bump.outputs.tag }}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${{ steps.bump.outputs.tag }}" >/dev/null; then
            git tag "${{ steps.bump.outputs.tag }}"
          fi
          git push origin HEAD "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes
