name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # デプロイ前に CI と同じ検証を通す
      - name: Verify
        run: pnpm check

      # 静的サイトは同一 Worker から配信するため、先にビルドしておく
      - name: Build site
        run: pnpm --filter @mizunashi/web build

      - name: Deploy
        run: pnpm --filter @mizunashi/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -e
          curl -fsS https://mizunashi.otnc.dev/api/v1/healthz | tee /dev/stderr | grep -q '"status"'
          curl -fsS https://mizunashi.otnc.dev/ -o /dev/null
