name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager を置かない方針（AGENTS.md §3）なので、ここで版を指示する。
      # 上限を切らないという方針に合わせて latest を使う
      - uses: pnpm/action-setup@v4
        with:
          version: latest

      # engines の下限で検証する。手元の最新でしか動かない状態を防ぐ（AGENTS.md §3）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: eslint-${{ hashFiles('pnpm-lock.yaml') }}-

      # どの段階で落ちたかをログ上で明確にするため個別に走らせる
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Project invariants
        run: pnpm check:invariants
