packages:
  - 'packages/*'
  - 'apps/*'

# ビルドスクリプトの実行を許可する依存を明示する
allowBuilds:
  # vitest が使う
  esbuild: true
  # wrangler が使う Workers ランタイム。ローカルの Miniflare 実行に必要
  workerd: true
  # wrangler の依存。この用途では使わないが postinstall を止めると install が失敗する
  sharp: true

# 依存バージョンはここで一元管理し、各パッケージは "catalog:" で参照する（AGENTS.md §4）
catalog:
  '@cloudflare/workers-types': ^4.20241230.0
  '@astrojs/check': ^0.9.4
  '@astrojs/react': ^4.1.2
  '@eslint/js': ^9.17.0
  '@tailwindcss/vite': ^4.0.0
  '@types/node': ^22.10.0
  '@types/react': ^19.0.2
  '@types/react-dom': ^19.0.2
  astro: ^5.1.1
  eslint: ^9.17.0
  eslint-config-prettier: ^9.1.0
  fast-xml-parser: ^4.5.1
  fflate: ^0.8.2
  hono: ^4.6.14
  prettier: ^3.4.2
  publint: ^0.3.2
  react: ^19.0.0
  'react-dom': ^19.0.0
  tailwindcss: ^4.0.0
  tsup: ^8.3.5
  typescript: ^5.7.2
  typescript-eslint: ^8.18.0
  vitest: ^2.1.8
  wrangler: ^3.99.0
  zod: ^3.24.1
