packages:
  - 'packages/*'
  - 'apps/*'

# vitest が使う esbuild のみビルドスクリプトを許可する
allowBuilds:
  esbuild: true

# 依存バージョンはここで一元管理し、各パッケージは "catalog:" で参照する（AGENTS.md §4）
catalog:
  '@eslint/js': ^9.17.0
  '@types/node': ^22.10.0
  eslint: ^9.17.0
  eslint-config-prettier: ^9.1.0
  fast-xml-parser: ^4.5.1
  fflate: ^0.8.2
  prettier: ^3.4.2
  typescript: ^5.7.2
  typescript-eslint: ^8.18.0
  vitest: ^2.1.8
  zod: ^3.24.1
